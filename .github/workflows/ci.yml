name: CI

on:
  push:
    branches: [GIM17]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  invariants:
    name: Strict enforceable-invariants gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core only — stdlib runtime)
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Strict invariant gate (10y x full actor set)
        env:
          GIM18_INVARIANT_MODE: strict
        run: python scripts/check_invariants.py
      - name: Core unit tests (invariants, determinism, params, priors, ensemble, scoring, welfare)
        run: python -m unittest tests.test_invariants tests.test_determinism tests.test_params tests.test_priors tests.test_ensemble tests.test_scoring tests.test_welfare -v
